<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms Simplified</title>
    <style>
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .description {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .analyze-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        .analyze-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        
        .loading-text {
            font-size: 13px;
            margin-top: 15px;
            opacity: 0.9;
        }
        
        .skeleton {
            width: 250px;
            height: 14px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            margin: 6px 0;
            position: relative;
            overflow: hidden;
        }
        
        .skeleton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .results-container {
            display: none;
            padding: 16px;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .results-header {
            text-align: center;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 10;
            padding-bottom: 8px;
        }
        
        .results-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .domain-info {
            font-size: 11px;
            opacity: 0.8;
        }
        
        .analysis-list {
            margin-bottom: 16px;
        }
        
        .analysis-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        
        .analysis-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .analysis-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        
        .analysis-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .analysis-title {
            font-size: 13px;
            font-weight: 500;
            flex: 1;
            text-align: left;
        }
        
        .risk-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .risk-high {
            background: #ff4757;
            color: white;
        }
        
        .risk-medium {
            background: #ffa502;
            color: white;
        }
        
        .risk-low {
            background: #26de81;
            color: white;
        }
        
        .expand-icon {
            transition: transform 0.2s ease;
            font-size: 12px;
        }
        
        .expand-icon.expanded {
            transform: rotate(180deg);
        }
        
        .analysis-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 16px;
        }
        
        .analysis-details.expanded {
            max-height: 400px;
            padding: 0 16px 16px 16px;
        }
        
        .detail-section {
            margin-bottom: 12px;
        }
        
        .detail-label {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        
        .detail-content {
            font-size: 12px;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 4px;
        }
        
        .exact-phrase {
            font-style: italic;
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid rgba(255, 255, 255, 0.5);
        }
        
        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 12px;
            width: 100%;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .error-container {
            display: none;
            padding: 20px;
            text-align: center;
            height: 100%;
            box-sizing: border-box;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .error-message {
            font-size: 13px;
            line-height: 1.4;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="title">Terms Simplified</div>
        <div class="description">Analyze terms and conditions with AI to identify potential issues and harmful clauses</div>
        <button class="analyze-btn" id="analyzeBtn">Analyze T&C</button>
    </div>
    
    <div class="loading-container" id="loadingContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton" style="width: 180px;"></div>
        <div class="skeleton" style="width: 220px;"></div>
        <div class="loading-text" id="loadingText">Loading T&C...</div>
    </div>
    
    <div class="results-container" id="resultsContainer">
        <div class="results-header">
            <div class="results-title">⚖️ Analysis Results</div>
            <div class="domain-info" id="domainInfo"></div>
        </div>
        <div class="analysis-list" id="analysisList"></div>
        <button class="back-btn" id="backBtn">← Back to Home</button>
    </div>
    
    <div class="error-container" id="errorContainer">
        <div class="error-icon">❌</div>
        <div class="error-title">Analysis Failed</div>
        <div class="error-message" id="errorMessage"></div>
        <button class="back-btn" id="errorBackBtn">← Back to Home</button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
