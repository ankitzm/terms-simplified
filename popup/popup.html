<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms Simplified</title>
    <style>
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .description {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        
        .analyze-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        .analyze-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        
        .loading-text {
            font-size: 12px;
            margin-top: 12px;
            opacity: 0.9;
        }
        
        .skeleton {
            width: 200px;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            margin: 4px 0;
            position: relative;
            overflow: hidden;
        }
        
        .skeleton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .results-container {
            display: none;
            padding: 16px;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .results-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .flaw-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 6px;
            font-size: 11px;
            line-height: 1.3;
            border-left: 3px solid #ff6b6b;
        }
        
        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="title">Terms Simplified</div>
        <div class="description">Analyze terms and conditions with AI to identify potential issues</div>
        <button class="analyze-btn" id="analyzeBtn">Analyze T&C</button>
    </div>
    
    <div class="loading-container" id="loadingContainer">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton" style="width: 150px;"></div>
        <div class="loading-text" id="loadingText">Loading T&C...</div>
    </div>
    
    <div class="results-container" id="resultsContainer">
        <div class="results-title">⚠️ Potential Issues Found</div>
        <div id="flawsList"></div>
        <button class="back-btn" id="backBtn">Back to Home</button>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
